[pytest]
# -n 8 runs the suite on 8 pytest-xdist workers (about 25s instead of about
# 85s). More workers was slower on a 64-thread machine: startup dominates.
# Use `-n 0` to run serially when debugging.
addopts = --import-mode=importlib -n 8
testpaths = tests
markers =
    integration: builds and installs the wheel, then runs the installed command on throwaway repositories
