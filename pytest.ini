[pytest]
# -n 8 runs the suite on 8 pytest-xdist workers. Most of the run time is
# process launches (git, python, the fake CLIs), and on Windows those contend
# system-wide: measured 2026-10-17 on a 64-thread machine with about 2,180
# tests, 8 workers took 2m20s on a quiet machine and up to 4m under other
# load, 12 was within noise of 8, and 16 or more were slower. Use `-n 0` to
# run serially when debugging.
addopts = --import-mode=importlib -n 8
testpaths = tests
markers =
    integration: builds and installs the wheel, then runs the installed command on throwaway repositories
