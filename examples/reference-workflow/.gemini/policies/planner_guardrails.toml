# llm-handoff guardrails for every role mapped to Gemini CLI. The file name
# is historical; the rules are role-agnostic and apply to any Gemini CLI
# session once installed in the user tier.
#
# Gemini CLI's policy engine reads [[rule]] tables with toolName,
# commandPrefix, decision, and priority (0-999). Deny rules apply in every
# approval mode, including --yolo.
#
# IMPORTANT: Gemini CLI's workspace (project) policy tier is currently
# disabled, so this file has no effect while it only lives in the project's
# .gemini/policies/ directory. Install it in the user tier to enforce it:
#
#   macOS / Linux:
#     mkdir -p ~/.gemini/policies
#     cp .gemini/policies/planner_guardrails.toml ~/.gemini/policies/
#
#   Windows (PowerShell):
#     New-Item -ItemType Directory -Force "$env:USERPROFILE\.gemini\policies"
#     Copy-Item .gemini\policies\planner_guardrails.toml "$env:USERPROFILE\.gemini\policies\"
#
# User-tier rules apply to every Gemini CLI session for that account, not just
# dispatched roles. Command-prefix rules are a guardrail, not a security
# boundary: a determined agent can reach the same effect through another
# command. The container sandbox and the absence of a push credential are the
# boundary.

[[rule]]
toolName = "run_shell_command"
commandPrefix = "git push"
decision = "deny"
priority = 900

[[rule]]
toolName = "run_shell_command"
commandPrefix = "curl"
decision = "deny"
priority = 900

[[rule]]
toolName = "run_shell_command"
commandPrefix = "wget"
decision = "deny"
priority = 900

[[rule]]
toolName = "run_shell_command"
commandPrefix = ["rm -rf", "rm -fr"]
decision = "deny"
priority = 900

[[rule]]
toolName = "run_shell_command"
commandPrefix = "git reset --hard"
decision = "deny"
priority = 900
