# llm-handoff reference workflow configuration.
#
# Copy this file to a target repository as dispatch_config.yaml, then adjust
# provider binaries, models, timeouts, and role-provider mappings for that
# repository. The shipped mapping is only the reference workflow default.

handoff_path: docs/handoff/HANDOFF.md
project_state_path: PROJECT_STATE.md
auto_push: false

# Opt-in deterministic work-claim gate. When true, a ready_for_review handoff
# from backend or frontend is checked against the planner's Work Packet
# (scope_sha at HEAD, diff inside Files in scope, Verification command exits 0)
# before the auditor is dispatched. The Verification command is agent-written
# text executed in repo_root; see CONFIGURATION.md.
enforce_work_packet: false
# Who commits implementer work: agent (default) or dispatcher. dispatcher
# keeps agents out of .git and needs enforce_work_packet: true.
commit_mode: agent
# What happens to audited work: local (default), merge-commit (story branch
# merged with a report commit), or pr (story branch pushed as a pull request;
# needs commit_mode: dispatcher and the gh CLI). See CONFIGURATION.md.
publish:
  mode: local
work_packet_verification_timeout_seconds: 600
# Optional scanners for the work-claim gate (gitleaks, semgrep, bandit,
# pip-audit, or any tool the target repo installs). See CONFIGURATION.md for
# the copyable example and the placeholder list.
scanners: []

agents:
  planner:
    provider: gemini
    binary: gemini
    mention: "@planner"
    resume: true
    timeout_ms: 1200000

  backend:
    provider: codex
    binary: codex
    skill_name: llm-handoff
    resume: true
    timeout_ms: 1200000

  frontend:
    provider: gemini
    binary: gemini
    mention: "@frontend"
    resume: false
    timeout_ms: 1200000

  auditor:
    provider: claude
    binary: claude
    model: claude-opus-5-5
    resume: false
    timeout_ms: 900000

  validator:
    provider: claude
    binary: claude
    model: claude-haiku-5-5
    resume: false
    timeout_ms: 900000

  finalizer:
    provider: claude
    binary: claude
    model: claude-opus-5-5
    resume: false
    timeout_ms: 900000

normalizer:
  provider: claude
  model: claude-haiku-5-5
  timeout_ms: 60000
  on_unknown: fail_closed
  # Registered normalizer providers: claude, gemini, openai.
  # Claude can fall back to CLI auth; Gemini and OpenAI are API-key only.

# Optional audit fan-out. The defaults keep the single quality auditor.
# Add `security` to run a read-only security reviewer next to it; the
# dispatcher then writes HANDOFF.md from both structured verdicts.
audit:
  reviewers: [quality]
  # security_provider: claude   # claude | gemini | codex; unset = auto
  block_severity: high          # critical | high | medium | low
  review_timeout_ms: 900000
