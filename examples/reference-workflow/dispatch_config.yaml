# llm-handoff reference workflow configuration.
#
# Copy this file to a target repository as dispatch_config.yaml, then adjust
# provider binaries, models, timeouts, and role-provider mappings for that
# repository. The shipped mapping is only the reference workflow default.

handoff_path: docs/handoff/HANDOFF.md
project_state_path: PROJECT_STATE.md
auto_push: false
# Bounded planner recovery at dispatcher pauses (not next_agent: user): one
# planner attempt per pause streak, then the dispatcher waits for a HANDOFF.md
# edit. "off" (quoted; YAML reads a bare off as false) always waits.
pause_recovery: planner

# Deterministic work-claim gate, on by default. A ready_for_review handoff
# from backend or frontend is checked against the planner's Work Packet
# (scope_sha at HEAD, diff inside Files in scope, Verification command exits 0)
# before the auditor is dispatched. The Verification command is agent-written
# text executed in repo_root; see llm-handoff's CONFIGURATION.md. To turn the
# gate off, set enforce_work_packet: false and give a reason, which every
# start and `llm-handoff doctor` report as a warning:
#   enforce_work_packet: false
#   work_packet_opt_out_reason: "<why>"
enforce_work_packet: true
# Who commits implementer work: agent (default) or dispatcher. dispatcher
# keeps agents out of .git and needs enforce_work_packet: true.
commit_mode: agent
# What happens to audited work: local (default), merge-commit (story branch
# merged with a report commit), or pr (story branch pushed as a pull request;
# needs commit_mode: dispatcher and the gh CLI).
# See llm-handoff's CONFIGURATION.md.
publish:
  mode: local
# Optional Verification command allowlist (recommended). When set, the gate
# runs a Work Packet Verification command only if its leading words match one
# of these prefixes and it has no shell control character (& | ; < > $ ` ( )
# % ! or a line break); otherwise the claim fails verification_not_allowed and
# routes to planner. Empty runs any command, with a warning at every start and
# in `llm-handoff doctor`. `llm-handoff init --verification-command` writes the
# confirmed command here.
#   verification_allowed_prefixes: ["python -m pytest"]
work_packet_verification_timeout_seconds: 600
# Optional scanners for the work-claim gate (gitleaks, semgrep, bandit,
# pip-audit, or any tool the target repo installs). See
# llm-handoff's CONFIGURATION.md for the copyable example and the placeholder
# list.
scanners: []

agents:
  planner:
    provider: gemini
    binary: gemini
    mention: "@planner"
    resume: true
    timeout_ms: 1200000

  backend:
    provider: codex
    binary: codex
    skill_name: llm-handoff
    resume: true
    timeout_ms: 1200000

  frontend:
    provider: gemini
    binary: gemini
    mention: "@frontend"
    resume: false
    timeout_ms: 1200000

  auditor:
    provider: claude
    binary: claude
    model: claude-opus-5-5
    resume: false
    timeout_ms: 900000

  validator:
    provider: claude
    binary: claude
    model: claude-haiku-5-5
    resume: false
    timeout_ms: 900000

  finalizer:
    provider: claude
    binary: claude
    model: claude-opus-5-5
    resume: false
    timeout_ms: 900000

normalizer:
  provider: claude
  model: claude-haiku-5-5
  timeout_ms: 60000
  on_unknown: fail_closed
  # Registered normalizer providers: claude, codex, gemini, openai.
  # Claude can fall back to CLI auth; Codex always uses the Codex CLI
  # login; Gemini and OpenAI are API-key only.
  # `model` must name a model of the selected provider; when you change the
  # provider, change or remove `model` too. Omitting it selects that
  # provider's default.

# Audit fan-out. By default a read-only security reviewer runs next to the
# quality reviewer, and the dispatcher writes HANDOFF.md from both structured
# verdicts. With security_provider unset, the dispatcher picks the first
# installed CLI (claude, codex, gemini) that differs from the implementer's
# provider, else the implementer's own vendor with a warning. A reviewer that
# cannot launch stops the dispatcher at startup. To opt out, set
#   reviewers: [quality]
#   security_opt_out_reason: "<why this repository skips security review>"
# Every dispatcher start and `llm-handoff doctor` warn with that reason.
audit:
  reviewers: [quality, security]
  # security_provider: claude   # claude | gemini | codex; unset = auto
  # security_model: <model>   # claude reviewer only; unset = borrow the first claude role's model
  block_severity: high          # critical | high | medium | low
  review_timeout_ms: 900000
