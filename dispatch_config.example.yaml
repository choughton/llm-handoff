# Example llm-handoff configuration.
#
# This file documents the shipped reference role-to-provider mapping for source
# checkout users and target-repo templates. Roles can be remapped to registered
# runtime adapters: codex, antigravity, or claude.
#
# Launch flags are safe by default: Claude Code runs in dontAsk mode with an
# allowed_tools list, Codex in its workspace-write sandbox, and the Antigravity
# CLI (agy) with --mode accept-edits, so it edits workspace files but its shell
# commands need permissions.allow grants in the agy user settings. `unsafe_bypass: true` on a
# role restores the old bypass flags and is logged as a startup warning.

handoff_path: docs/handoff/HANDOFF.md
project_state_path: PROJECT_STATE.md
# Closed epics and their ledger lines; the finalizer moves them here.
completed_work_path: COMPLETED_WORK.md
backend_resume: true
planner_resume: true
# Bounded planner recovery at dispatcher pauses (not next_agent: user): one
# planner attempt per pause streak, then the dispatcher waits for a HANDOFF.md
# edit. "off" (quoted; YAML reads a bare off as false) always waits.
pause_recovery: planner
# Operator prompt at pauses when stdin is a TTY (not in --dry-run or with
# poll_interval_seconds: 0): Enter or text dispatches the planner,
# `@backend|@frontend|@auditor <message>` dispatches that role directly,
# `retry` re-runs the cycle, `quit` stops. --no-interactive-pause also turns
# it off.
interactive_pause: true
# Interpreter grants, off by default. true grants python, python3, and pytest
# in the default Claude tool list (Bash(python:*), Bash(python3:*),
# Bash(pytest:*)) and in the agy allow entries. Any of them lets an agent run
# any command past the allowlist, git push included, so turn it on only if
# you accept that. A role that sets its own allowed_tools keeps that list.
# The work-claim gate runs the Verification command either way.
# interpreter_grants: false

# Deterministic work-claim gate, on by default. A ready_for_review handoff
# from backend or frontend is checked against the planner's Work Packet
# (scope_sha at HEAD, diff inside Files in scope, Verification command exits 0)
# before the auditor is dispatched. The Verification command is agent-written
# text executed in repo_root; see CONFIGURATION.md. To turn the gate off, set
# enforce_work_packet: false and give a reason, which every start and
# `llm-handoff doctor` report as a warning:
#   enforce_work_packet: false
#   work_packet_opt_out_reason: "<why>"
enforce_work_packet: true
# Who commits implementer work: agent (default) or dispatcher. dispatcher
# keeps agents out of .git and needs enforce_work_packet: true.
commit_mode: agent
# What happens to audited work: local (default), merge-commit (story branch
# merged with a report commit), or pr (story branch pushed as a pull request;
# needs commit_mode: dispatcher and the gh CLI). In pr mode with auto_merge,
# wait_for_reviewers: [codex] merges only after a Codex review of the pushed
# commit finishes with no findings. A review that fails, or shows running for
# review_stall_seconds with no result, is requested again once; if that one
# does not finish either, review_stall_action decides: prompt (ask the
# operator) or merge (merge without the review when the audit passed for the
# head commit and no review thread is unresolved). See CONFIGURATION.md.
publish:
  mode: local
  # review_stall_seconds: 600
  # review_stall_action: prompt
work_packet_verification_timeout_seconds: 600
# The Verification command and scanners get an allowlisted environment (PATH,
# HOME, TEMP, and other process basics), not the dispatcher's full
# environment. List any extra variable names they need. Vendor API keys are
# rejected.
# work_claim_env_passthrough: [HTTPS_PROXY, SSL_CERT_FILE]
# Optional Verification command allowlist (recommended). When set, the gate
# runs a Work Packet Verification command only if its leading words match one
# of these prefixes and it has no shell control character (& | ; < > $ ` ( )
# % ! or a line break); otherwise the claim fails verification_not_allowed and
# routes to planner. Empty runs any command, with a warning at every start and
# in `llm-handoff doctor`.
# verification_allowed_prefixes: ["python -m pytest"]

# Operator-configured scanners that the work-claim gate runs after the scope
# checks pass and before the Work Packet verification command. They only run
# while enforce_work_packet is true. A scanner runs only when it is listed
# under scanners: and its executable is on PATH. llm-handoff installs none of
# these tools; install them in the target repository's environment yourself.
# A missing executable fails every claim the scanner applies to with
# scanner_missing:<name> when required: true, and is skipped when
# required: false. A command that uses {changed_files} or {changed_py_files}
# is skipped on claims where that list is empty. Run
# `llm-handoff doctor` to see which configured scanners will run.
# For Python repositories, bandit, pip-audit, and gitleaks are recommended.
# Use semgrep only with a pinned local ruleset kept in the repository
# (--config <path to a ruleset in the repo>), not --config auto, which
# downloads rules from the network at run time.
# Placeholders: {diff_range} = <pre-dispatch HEAD>..<scope_sha>,
# {changed_files} and {changed_py_files} = shell-quoted changed paths,
# {repo_root} = shell-quoted repository root. Double literal braces.
scanners:
  - name: gitleaks
    command: gitleaks git --no-banner --redact --log-opts="{diff_range}" {repo_root}
    timeout_ms: 300000
    required: true
  # - name: semgrep
  #   command: semgrep scan --config .semgrep/rules.yml --metrics off --error --quiet {changed_files}
  #   timeout_ms: 300000
  #   required: true
  - name: bandit
    command: bandit -q {changed_py_files}
    timeout_ms: 120000
    required: true
  - name: pip-audit
    # Dependency audits are not diff-shaped, so this one runs unscoped.
    command: pip-audit --strict
    timeout_ms: 300000
    required: false
# Control files a role may only change when its Work Packet lists them under
# Files in scope. Any other change routes the handoff to user. [] disables.
protected_paths:
  - AGENTS.md
  - docs/handoff/HANDBOOK.md
  - docs/handoff/*_PROMPT.md
  - docs/handoff/README.md
  - dispatch_config.yaml
  - .claude/**
  - .codex/**
  - .gemini/**
  - .agents/**
  - .githooks/**

agents:
  planner:
    provider: antigravity
    binary: agy
    resume: true
    timeout_ms: 1200000

  backend:
    provider: codex
    binary: codex
    skill_name: llm-handoff
    resume: true
    timeout_ms: 1200000
    # Launch environments are allowlisted by default (env_mode: allowlist).
    # Add extra variable names here; vendor API keys are not accepted.
    # env_passthrough: [HTTPS_PROXY]
    # Optional: rerun this dispatch on another agent when the primary times
    # out, hits a rate or usage limit, is not signed in, or will not launch.
    # fallback:
    #   provider: claude
    #   model: claude-sonnet-5-5
    # Optional: kill the agent after this long with no output, so a hang fails
    # over before timeout_ms. Off by default; some CLIs stay silent for long
    # stretches while they work, so set it well above their quiet periods.
    # idle_timeout_ms: 300000

  frontend:
    provider: antigravity
    binary: agy
    resume: false
    timeout_ms: 1200000

  auditor:
    provider: claude
    binary: claude
    model: claude-opus-5-5
    resume: false
    timeout_ms: 900000
    # Replaces the default dontAsk allowlist for this role when set.
    # allowed_tools: [Read, Grep, Glob, "Bash(git diff:*)"]
    # unsafe_bypass: false

  validator:
    provider: claude
    binary: claude
    model: claude-haiku-5-5
    resume: false
    timeout_ms: 900000

  finalizer:
    provider: claude
    binary: claude
    model: claude-opus-5-5
    resume: false
    timeout_ms: 900000

  # Optional tpm role. When it is configured, the auditor's story-level
  # approvals and the planner's epic opens route to the tpm, which assigns
  # the next story; the planner keeps epic choice, pause recovery, and
  # repairs. When it is absent, the planner picks every story.
  # tpm:
  #   provider: codex
  #   binary: codex
  #   skill_name: llm-handoff-tpm
  #   resume: false
  #   timeout_ms: 1200000

normalizer:
  provider: claude
  model: claude-haiku-5-5
  timeout_ms: 60000
  on_unknown: fail_closed
  # Registered normalizer providers: antigravity, claude, codex, openai.
  # Claude falls back to its CLI login without an API key; Codex and
  # Antigravity (`agy`) always use their CLI login; OpenAI is API-key only.
  # `model` must name a model of the selected provider; when you change the
  # provider, change or remove `model` too. Omitting it selects that
  # provider's default.

# Audit fan-out. By default a read-only security reviewer runs next to the
# quality reviewer, and the dispatcher writes HANDOFF.md from both structured
# verdicts. With security_provider unset, the dispatcher picks the first
# installed CLI (claude, codex, antigravity) that differs from the
# implementer's provider, else the implementer's own vendor with a warning.
# The antigravity (agy) reviewer passed an operator-run live check
# (agy 1.4.2): it used only view_file and flagged an injected tool request.
# See llm-handoff's CONFIGURATION.md for what that check does and does not
# show. A reviewer that cannot launch stops the dispatcher at startup. To opt
# out, set
#   reviewers: [quality]
#   security_opt_out_reason: "<why this repository skips security review>"
# Every dispatcher start and `llm-handoff doctor` warn with that reason.
audit:
  reviewers: [quality, security]
  # security_provider: claude   # claude | codex | antigravity; unset = auto
  # security_model: <model>   # claude reviewer only; unset = borrow the first claude role's model
  block_severity: high          # critical | high | medium | low
  review_timeout_ms: 900000

# Optional Linear mode, off by default (provider: none; omitting the block is
# the same). With provider: linear, agents read and update this repository's
# Linear issue pool through their own CLI's Linear MCP connector; the
# dispatcher never calls Linear and holds no Linear credential. Linear mode
# needs enforce_work_packet: true. With provider: none, no other tracker key
# may be set. The block is validated at load; nothing else reads it yet. See
# CONFIGURATION.md.
# tracker:
#   provider: linear              # none (default) | linear
#   team: ENG                     # Linear team key
#   project: Platform             # exactly one of project / label
#   label: null                   # opt-in label for this repository
#   eligible_state: Todo
#   in_progress_state: In Progress
#   success_state: In Review      # Done only when you want it
#   blocked_state: null           # optional
#   user_attention_label: needs-operator   # optional
#   mcp_server: linear            # Linear server name in each CLI's MCP config
#   claude_mcp_config: null       # optional file, relative to the repo root
