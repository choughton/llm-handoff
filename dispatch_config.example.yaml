# Example llm-handoff configuration.
#
# This file documents the shipped reference role-to-provider mapping for source
# checkout users and target-repo templates. Roles can be remapped to registered
# runtime adapters: codex, gemini, or claude.

handoff_path: docs/handoff/HANDOFF.md
project_state_path: PROJECT_STATE.md
auto_push: false
backend_resume: true
planner_resume: true
planner_api_key_env: false

# Opt-in deterministic work-claim gate. When true, a ready_for_review handoff
# from backend or frontend is checked against the planner's Work Packet
# (scope_sha at HEAD, diff inside Files in scope, Verification command exits 0)
# before the auditor is dispatched. The Verification command is agent-written
# text executed in repo_root; see CONFIGURATION.md.
enforce_work_packet: false
work_packet_verification_timeout_seconds: 600

# Operator-configured scanners that the work-claim gate runs after the scope
# checks pass and before the Work Packet verification command. They only run
# while enforce_work_packet is true. Each tool must already be installed in the
# target repository's environment; llm-handoff does not bundle them.
# Placeholders: {diff_range} = <pre-dispatch HEAD>..<scope_sha>,
# {changed_files} and {changed_py_files} = shell-quoted changed paths,
# {repo_root} = shell-quoted repository root. Double literal braces.
scanners:
  - name: gitleaks
    command: gitleaks git --no-banner --redact --log-opts="{diff_range}" {repo_root}
    timeout_ms: 300000
    required: true
  - name: semgrep
    command: semgrep scan --config auto --error --quiet {changed_files}
    timeout_ms: 300000
    required: true
  - name: bandit
    command: bandit -q {changed_py_files}
    timeout_ms: 120000
    required: true
  - name: pip-audit
    # Dependency audits are not diff-shaped, so this one runs unscoped.
    command: pip-audit --strict
    timeout_ms: 300000
    required: false

agents:
  planner:
    provider: gemini
    binary: gemini
    mention: "@planner"
    resume: true
    timeout_ms: 1200000

  backend:
    provider: codex
    binary: codex
    skill_name: llm-handoff
    resume: true
    timeout_ms: 1200000

  frontend:
    provider: gemini
    binary: gemini
    mention: "@frontend"
    resume: false
    timeout_ms: 1200000

  auditor:
    provider: claude
    binary: claude
    model: claude-opus-4-7
    resume: false
    timeout_ms: 900000

  validator:
    provider: claude
    binary: claude
    model: claude-haiku-4-5
    resume: false
    timeout_ms: 900000

  finalizer:
    provider: claude
    binary: claude
    model: claude-opus-4-7
    resume: false
    timeout_ms: 900000

normalizer:
  provider: claude
  model: claude-haiku-4-5
  timeout_ms: 60000
  on_unknown: fail_closed
  # Registered normalizer providers: claude, gemini, openai.
  # Claude can fall back to CLI auth; Gemini and OpenAI are API-key only.

# Optional audit fan-out. The defaults keep the single quality auditor.
# Add `security` to run a read-only security reviewer next to it; the
# dispatcher then writes HANDOFF.md from both structured verdicts.
audit:
  reviewers: [quality]
  # security_provider: claude   # claude | gemini | codex; unset = auto
  block_severity: high          # critical | high | medium | low
  review_timeout_ms: 900000
