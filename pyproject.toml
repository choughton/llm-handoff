[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "llm-handoff"
version = "0.1.0"
description = "A file-based handoff dispatcher for multi-CLI agent workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Chad Houghton" }]
keywords = [
    "ai-agents",
    "antigravity",
    "claude-code",
    "codex",
    "handoff",
    "llm",
    "multi-agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
]
# Runtime dependencies mirror requirements-dev.txt without the test and lint
# tools (pytest, pytest-xdist, pre-commit, ruff) and the build backend
# (hatchling).
dependencies = [
    "anthropic",
    "click",
    "instructor",
    "openai",
    "pydantic",
    "PyYAML",
    "typer",
]

[project.urls]
Homepage = "https://github.com/choughton/llm-handoff"
Repository = "https://github.com/choughton/llm-handoff"
Issues = "https://github.com/choughton/llm-handoff/issues"
Changelog = "https://github.com/choughton/llm-handoff/blob/main/CHANGELOG.md"

[project.scripts]
llm-handoff = "llm_handoff.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["llm_handoff"]

# examples/reference-workflow/ stays the single source for the init template.
# force-include maps it into the wheel at build time, hidden paths included
# (.claude/, .codex/, .gitignore), so `init` works
# from an installed package.
[tool.hatch.build.targets.wheel.force-include]
"examples/reference-workflow" = "llm_handoff/templates/reference-workflow"
