# Runs the test suite on the same runner and Python versions as the publish
# workflow. Manual only (Actions > Tests > Run workflow): run it on main
# before tagging a release to catch CI-only failures, such as Python 3.11 or
# the runner's Git version, before the tag's publish run does.
name: Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Configure Git for tests that commit
        run: |
          git config --global user.name "llm-handoff tests"
          git config --global user.email "tests@example.invalid"
      - name: Run the test suite
        run: python -m pytest tests -q
